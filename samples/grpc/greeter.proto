// greeter.proto — companion schema for HorseNghttp2GrpcDemo (M4b).
//
// Wire tags MUST match TProtoMember(N) attributes in
// Sample.Greeter.Messages.pas. Delphi property names may differ (e.g.
// GreetResponse.message → Delphi property `text`) — proto3 wire format
// keys off tag number, not name.

syntax = "proto3";

package greeter;

service Greeter {
  rpc Greet (GreetRequest) returns (GreetResponse);
  rpc Echo  (EchoRequest)  returns (EchoResponse);
}

message GreetRequest {
  string name = 1;
}

message GreetResponse {
  string message = 1;
}

message EchoRequest {
  int32  i32 = 1;
  int64  i64 = 2;
  bool   b   = 3;
  string s   = 4;
  float  f32 = 5;
  double f64 = 6;
}

message EchoResponse {
  int32  i32 = 1;
  int64  i64 = 2;
  bool   b   = 3;
  string s   = 4;
  float  f32 = 5;
  double f64 = 6;
}
